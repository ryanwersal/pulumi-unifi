version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Default is direct-only, which breaks the build for lockstep module pairs:
    # bumping pulumi/sdk/v3 alone leaves the indirect pulumi/pkg/v3 pinned at the
    # old version, and pkg/v3 references sdk internals that move between releases.
    # Everything lands in one grouped PR, so this doesn't add PR volume.
    allow:
      - dependency-type: all
    ignore:
      # v2.x is a pre-modules stray with an API pulumi/sdk can't build against,
      # and it stays the newest this path offers since v3 moved to a /v3 path.
      - dependency-name: github.com/cheggaaa/pb
        update-types:
          - version-update:semver-major
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
